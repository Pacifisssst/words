<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set 2 + A classic read · practice</title><style>body{font:24px/1.3 "Avenir Next",sans-serif;color:#111c37;background:#fffdf7;margin:0}main{max-width:900px;margin:auto;padding:25px}h1{font-size:36px}button{font:inherit;font-size:20px;padding:12px 18px;border:0;border-radius:10px;background:#111c37;color:white;margin:4px;cursor:pointer}button:focus-visible{outline:3px solid #2f59ff;outline-offset:4px}button:disabled{opacity:.4}img{height:230px;max-width:100%;object-fit:contain}article{text-align:center;padding:25px;border-block:1px solid #cbd2e0;margin:15px 0}.answer{font-size:32px;color:#11724a;font-weight:650}.small{font-size:17px;color:#53617d}[hidden]{display:none!important}audio{width:100%}#wordscene{background-image:url("img/adventure-atlas.png");background-size:300% 300%;width:min(100%,600px);aspect-ratio:1.5;margin:auto;border-radius:12px}#wordscene{background-image:none}#wordscene svg{display:block;width:100%;height:100%;border-radius:12px}</style><main><h1>Вспомни → проверь → послушай</h1><button id="verbs">Set 2 · три формы</button><button id="words">2b · слова</button><p class="small"><a href="homework.pdf">Домашнее задание · PDF для телефона</a> · <a href="homework-print.pdf">Для печати</a></p><article><div id="wordscene" hidden role="img"></div><img id="pic" alt=""><h2 id="word"></h2><p id="ask">Назови V2 и V3.</p><div id="answer" hidden><p class="answer" id="forms"></p><p id="ru"></p><audio id="voice" controls preload="none"></audio></div><button id="show">Проверить</button></article><button id="prev">← Назад</button><button id="next">Дальше →</button><span id="count"></span><p class="small">Сначала ответь сам. Затем открой ответ и послушай. Клавиши: Space — ответ; → / ← — карточки. Три подхода по пять минут в разные дни.</p></main><script>const CARDS=[{"kind": "verbs", "word": "do", "answer": "do – did – done", "ru": "делать", "img": "img/irr2/do.jpg", "audio": "audio/trainer/do.mp3"}, {"kind": "verbs", "word": "make", "answer": "make – made – made", "ru": "создавать", "img": "img/irr2/make.jpg", "audio": "audio/trainer/make.mp3"}, {"kind": "verbs", "word": "get", "answer": "get – got – got", "ru": "получать", "img": "img/irr2/get.jpg", "audio": "audio/trainer/get.mp3"}, {"kind": "verbs", "word": "come", "answer": "come – came – come", "ru": "приходить", "img": "img/irr2/come.jpg", "audio": "audio/trainer/come.mp3"}, {"kind": "verbs", "word": "give", "answer": "give – gave – given", "ru": "давать", "img": "img/irr2/give.jpg", "audio": "audio/trainer/give.mp3"}, {"kind": "verbs", "word": "know", "answer": "know – knew – known", "ru": "знать", "img": "img/irr2/know.jpg", "audio": "audio/trainer/know.mp3"}, {"kind": "verbs", "word": "think", "answer": "think – thought – thought", "ru": "думать", "img": "img/irr2/think.jpg", "audio": "audio/trainer/think.mp3"}, {"kind": "verbs", "word": "tell", "answer": "tell – told – told", "ru": "рассказывать", "img": "img/irr2/tell.jpg", "audio": "audio/trainer/tell.mp3"}, {"kind": "verbs", "word": "buy", "answer": "buy – bought – bought", "ru": "покупать", "img": "img/irr2/buy.jpg", "audio": "audio/trainer/buy.mp3"}, {"kind": "verbs", "word": "bring", "answer": "bring – brought – brought", "ru": "приносить", "img": "img/irr2/bring.jpg", "audio": "audio/trainer/bring.mp3"}, {"kind": "words", "word": "adventure", "answer": "adventure /ədˈventʃə/", "ru": "приключение", "img": "", "audio": "audio/trainer/word-adventure.mp3", "scene": 0}, {"kind": "words", "word": "bush", "answer": "bush /bʊʃ/", "ru": "куст", "img": "", "audio": "audio/trainer/word-bush.mp3", "scene": 2}, {"kind": "words", "word": "cave", "answer": "cave /keɪv/", "ru": "пещера", "img": "", "audio": "audio/trainer/word-cave.mp3", "scene": 5}, {"kind": "words", "word": "compass", "answer": "compass /ˈkʌmpəs/", "ru": "компас", "img": "", "audio": "audio/trainer/word-compass.mp3", "scene": 7}, {"kind": "words", "word": "discover", "answer": "discover /dɪˈskʌvə/", "ru": "обнаруживать", "img": "", "audio": "audio/trainer/word-discover.mp3", "scene": 4}, {"kind": "words", "word": "explore", "answer": "explore /ɪkˈsplɔː/", "ru": "исследовать", "img": "", "audio": "audio/trainer/word-explore.mp3", "scene": 0}, {"kind": "words", "word": "explorer", "answer": "explorer /ɪkˈsplɔːrə/", "ru": "исследователь", "img": "", "audio": "audio/trainer/word-explorer.mp3", "scene": 6}, {"kind": "words", "word": "hide", "answer": "hide /haɪd/", "ru": "прятаться", "img": "", "audio": "audio/trainer/word-hide.mp3", "scene": 2}, {"kind": "words", "word": "huge", "answer": "huge /hjuːdʒ/", "ru": "огромный", "img": "", "audio": "audio/trainer/word-huge.mp3", "scene": 2}, {"kind": "words", "word": "initials", "answer": "initials /ɪˈnɪʃəlz/", "ru": "инициалы", "img": "", "audio": "audio/trainer/word-initials.mp3", "scene": 5}, {"kind": "words", "word": "journey", "answer": "journey /ˈdʒɜːni/", "ru": "путешествие", "img": "", "audio": "audio/trainer/word-journey.mp3", "scene": 3}, {"kind": "words", "word": "nephew", "answer": "nephew /ˈnefjuː/", "ru": "племянник", "img": "", "audio": "audio/trainer/word-nephew.mp3", "scene": 1}, {"kind": "words", "word": "plot", "answer": "plot /plɒt/", "ru": "сюжет", "img": "", "audio": "audio/trainer/word-plot.mp3", "scene": 0}, {"kind": "words", "word": "raft", "answer": "raft /rɑːft/", "ru": "плот", "img": "", "audio": "audio/trainer/word-raft.mp3", "scene": 8}, {"kind": "words", "word": "rock", "answer": "rock /rɒk/", "ru": "скала", "img": "", "audio": "audio/trainer/word-rock.mp3", "scene": 5}];let kind='verbs',i=0,list=CARDS.filter(x=>x.kind===kind);const el=id=>document.getElementById(id);function render(){const c=list[i];el('word').textContent=c.word;el('forms').textContent=c.answer;el('ru').textContent=c.ru;el('pic').hidden=!c.img;el('pic').src=c.img;el('pic').alt=c.ru;if(c.scene!=null){el('wordscene').hidden=false;drawWordScene(c.scene);el('wordscene').setAttribute('aria-label',c.ru)}else el('wordscene').hidden=true;el('voice').pause();el('voice').src=c.audio;el('answer').hidden=true;el('show').hidden=false;el('ask').textContent=kind==='verbs'?'Назови V2 и V3.':'Вспомни перевод.';el('count').textContent=(i+1)+' / '+list.length;el('prev').disabled=i===0;el('next').disabled=i===list.length-1;}function reveal(){el('answer').hidden=false;el('show').hidden=true;el('voice').play().catch(()=>{});}function mode(k){kind=k;list=CARDS.filter(x=>x.kind===kind);i=0;render()}el('verbs').onclick=()=>mode('verbs');el('words').onclick=()=>mode('words');el('show').onclick=reveal;el('next').onclick=()=>{i=Math.min(list.length-1,i+1);render()};el('prev').onclick=()=>{i=Math.max(0,i-1);render()};document.onkeydown=e=>{if(e.target.closest('button,audio'))return;if(e.key===' '){e.preventDefault();reveal()}if(e.key==='ArrowRight')el('next').click();if(e.key==='ArrowLeft')el('prev').click()};function drawWordScene(n){const r=[[0,0,507,334],[515,0,505,334],[1029,0,507,334],[0,342,507,322],[515,342,505,322],[1029,342,507,322],[0,672,507,352],[515,672,505,352],[1029,672,507,352]][n];el('wordscene').innerHTML=`<svg viewBox="${r.join(' ')}" preserveAspectRatio="xMidYMid meet"><defs><clipPath id="word-region"><rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}"/></clipPath></defs><image href="img/adventure-atlas.png" width="1536" height="1024" clip-path="url(#word-region)"/></svg>`;}render();</script></html>
