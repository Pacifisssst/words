<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meow English — 5Б · Module 2a + 2b</title>
<meta name="description" content="Тренажёр английского, 5Б. Глава 2a: have got, страны, can. Глава 2b: Spidey’s birthday — подарки и множественное число.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2c2f45; --ink2:#5d6280; --line:#e4e6ef; --bg:#ffffff; --soft:#f5f6fb;
  --green:#3fbf2a; --green-d:#2e9a1c; --green-bg:#ddf9cc; --green-ink:#2a7f16;
  --red:#ff5a5f; --red-d:#d93a40; --red-bg:#ffe1e2; --red-ink:#c22a30;
  --blue:#1fa8f0; --blue-d:#1287c6; --blue-bg:#e3f4fd;
  --purple:#8b5cf6; --purple-d:#6d3fe0; --purple-bg:#efe8ff;
  --gold:#ffbf1f; --gold-d:#e09a00; --orange:#ff9233;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,"Avenir Next",system-ui,sans-serif;font-weight:700}
body{min-height:100dvh}
::selection{background:var(--purple-bg);color:var(--purple-d)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.v{font-style:italic;font-weight:900;color:var(--purple-d)}
.ic{width:24px;height:24px;flex:none}

/* ---------- кнопки ---------- */
.btn{display:block;width:100%;padding:15px 18px;border-radius:16px;font-size:18px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;
  background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--green-d)}
.btn[disabled]{background:var(--line);color:#a3a8bf;box-shadow:0 4px 0 #d3d6e2;cursor:default}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.dlg{position:fixed;inset:0;z-index:50;background:rgba(20,24,40,.45);display:grid;place-items:center;padding:16px}
.dlgbox{background:#fff;border-radius:22px;padding:20px 16px 16px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;text-align:center}
.dlgbox p{margin:0 0 6px;font-size:20px;font-weight:900}

/* ---------- главная ---------- */
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:60px}
.logo{font-size:22px;font-weight:900;color:var(--orange);letter-spacing:-.01em;margin-right:auto}
.logo i{color:var(--purple-d)}
.pill{display:flex;align-items:center;gap:6px;font-weight:900;font-size:17px}
.pill.xp{color:var(--gold-d)} .pill.st{color:var(--orange)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink2)}
.iconbtn:hover{background:var(--soft)}

.hello{display:flex;align-items:flex-end;gap:10px;margin:18px 0 6px}
.hello img{width:118px;height:118px;object-fit:contain;flex:none}
.bubble{position:relative;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-size:16px;line-height:1.35;margin-bottom:22px}
.bubble:before{content:"";position:absolute;left:-10px;bottom:16px;width:16px;height:16px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble b{color:var(--purple-d)}

.path{position:relative;padding:52px 0 120px}
.unit{display:flex;flex-direction:column;align-items:center;margin:0 auto 30px;width:max-content;position:relative}
.node{width:82px;height:76px;border-radius:50%;display:grid;place-items:center;color:#fff;position:relative;
  background:var(--c,var(--green));box-shadow:0 7px 0 var(--cd,var(--green-d));transition:transform .08s,box-shadow .08s}
.node:active{transform:translateY(6px);box-shadow:0 1px 0 var(--cd,var(--green-d))}
.node svg{width:38px;height:38px}
.node.done{--c:var(--gold);--cd:var(--gold-d)}
.node.next:after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--c,var(--green));opacity:.35}
.unit .name{margin-top:14px;font-size:16px;font-weight:900;text-align:center}
.unit .sub{font-size:13px;color:var(--ink2);font-weight:700;text-align:center;max-width:200px}
.stars{display:flex;gap:2px;margin-top:4px;height:16px}
.stars svg{width:16px;height:16px}
.start-tag{position:absolute;top:-44px;background:#fff;border:2px solid var(--line);color:var(--c,var(--green));border-radius:12px;padding:6px 12px;font-weight:900;font-size:14px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.start-tag:after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-5px)}}
.reset{display:block;margin:10px auto 0;color:var(--ink2);font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* ---------- правило перед уровнем ---------- */
.intro{padding:20px 0 130px}
.intro h1{font-size:28px;line-height:1.15;margin:8px 0 4px;font-weight:900;text-wrap:balance}
.intro .lead{color:var(--ink2);font-size:17px;margin:0 0 16px}
.intro .robo{display:flex;gap:12px;align-items:flex-start}
.intro .robo img{width:92px;height:92px;object-fit:contain;flex:none}
.introscene img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:18px;margin:0 0 14px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.rules{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.rule{background:var(--soft);border-radius:16px;padding:12px 14px;font-size:17px;line-height:1.4}
.rule .eq{font-size:20px;font-weight:900;overflow-wrap:break-word}
.rule small{display:block;color:var(--ink2);font-size:15px;margin-top:2px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);padding:14px 0 calc(14px + env(safe-area-inset-bottom))}

/* ---------- урок ---------- */
.lbar{display:flex;align-items:center;gap:12px;height:62px}
.prog{flex:1;height:18px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--green);position:relative;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.prog i:after{content:"";position:absolute;left:10px;right:10px;top:4px;height:5px;border-radius:9px;background:rgba(255,255,255,.35)}
.hearts{display:flex;align-items:center;gap:4px;color:var(--red);font-weight:900;font-size:18px}
.combo{font-size:14px;color:var(--orange);font-weight:900;min-height:20px;margin-top:2px}
.qbody{padding:6px 0 260px}
.tag{display:inline-flex;align-items:center;gap:6px;color:var(--purple-d);background:var(--purple-bg);border-radius:10px;padding:3px 10px;font-size:13px;font-weight:900;margin-bottom:8px}
.tag.bonus{color:var(--gold-d);background:#fff3cf}
.prompt{font-size:22px;line-height:1.25;font-weight:900;margin:0 0 14px;text-wrap:balance}
.story{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:18px;padding:12px;margin-bottom:14px}
.story img{width:116px;height:76px;object-fit:cover;border-radius:12px;flex:none;background:#fff}
.story p{margin:0;font-size:16px;line-height:1.4;font-weight:700}
.scene{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.scene img{width:104px;height:104px;object-fit:contain;flex:none}
.scene .say{position:relative;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:24px;font-weight:900;flex:1;min-width:0}
.scene .say:before{content:"";position:absolute;left:-9px;top:50%;width:14px;height:14px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.bigeq{font-size:30px;font-weight:900;letter-spacing:.01em;white-space:nowrap}
.box{display:inline-grid;place-items:center;min-width:46px;height:44px;padding:0 8px;border-radius:12px;background:var(--purple);color:#fff;font-style:italic;box-shadow:0 3px 0 var(--purple-d);vertical-align:middle;margin:0 2px}
.answerline{display:flex;align-items:center;justify-content:center;gap:10px;font-size:26px;font-weight:900;margin:6px 0 16px}
.slot{min-width:120px;height:58px;border-radius:16px;border:3px dashed #c9b8fb;background:var(--purple-bg);display:grid;place-items:center;font-size:30px;color:var(--purple-d);padding:0 14px}
.slot.full{border-style:solid;border-color:var(--purple)}
.slot.none{font-size:18px;text-align:center;line-height:1.1}
.unitlbl{font-size:20px;color:var(--ink2)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:0 auto}
.key{height:56px;border-radius:14px;background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-size:24px;font-weight:900;display:grid;place-items:center}
.key:active{transform:translateY(4px);box-shadow:none}
.key.wide{grid-column:1/-1;font-size:17px;color:var(--purple-d);background:var(--purple-bg);border-color:#d7c8fd;box-shadow:0 4px 0 #d7c8fd}
.key.wide.on{background:var(--purple);color:#fff;border-color:var(--purple);box-shadow:0 4px 0 var(--purple-d)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 14px;border-radius:16px;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);background:#fff;font-size:21px;font-weight:900}
.opt .n{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--ink2);flex:none}
.opt.sel{border-color:var(--blue);background:var(--blue-bg);box-shadow:0 4px 0 var(--blue);color:var(--blue-d)}
.opt.sel .n{border-color:var(--blue);color:var(--blue-d)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.lineup{min-height:66px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;margin-bottom:18px}
.lineup.empty:before{content:"Нажимай на плитки по порядку";color:#a3a8bf;font-size:15px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-width:48px;height:50px;padding:0 14px;border-radius:12px;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);background:#fff;font-size:24px;font-weight:900}
.tile.used{visibility:hidden}
.hintbtn{display:inline-flex;align-items:center;gap:6px;color:var(--blue-d);font-weight:900;font-size:15px;padding:8px 0;margin-top:6px}
.hint{display:flex;gap:10px;align-items:center;background:var(--blue-bg);border-radius:16px;padding:10px 12px;margin-top:6px;font-size:16px;line-height:1.35}
.hint img{width:52px;height:52px;object-fit:contain;flex:none}

/* ---------- лист с ответом ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:16px 0 calc(16px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.25,1)}
.sheet.show{transform:none}
.sheet.ok{background:var(--green-bg);color:var(--green-ink)}
.sheet.bad{background:var(--red-bg);color:var(--red-ink)}
.sheet h3{margin:0 0 4px;font-size:24px;font-weight:900;display:flex;align-items:center;gap:8px}
.sheet .why{font-size:16px;line-height:1.4;margin:0 0 14px;color:var(--ink)}
.sheet .why b{color:inherit}
.sheet .row{display:flex;gap:12px;align-items:flex-start}
.sheet .row img{width:74px;height:74px;object-fit:contain;flex:none;margin-top:-34px}
.sheet.ok .btn{background:var(--green)} .sheet.bad .btn{background:var(--red);box-shadow:0 4px 0 var(--red-d)}

/* ---------- итог ---------- */
.done-screen{text-align:center;padding:24px 0 140px}
.done-screen img{width:200px;height:200px;object-fit:contain}
.done-screen h1{font-size:32px;font-weight:900;margin:8px 0 6px;color:var(--gold-d)}
.done-screen p{color:var(--ink2);font-size:17px;margin:0 0 18px}
.res{display:flex;gap:10px;justify-content:center;margin-bottom:10px}
.res div{flex:1;max-width:150px;border-radius:16px;border:2px solid var(--c);overflow:hidden}
.res b{display:block;background:var(--c);color:#fff;font-size:13px;text-transform:uppercase;letter-spacing:.05em;padding:4px}
.res span{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 4px;font-size:22px;font-weight:900;color:var(--c)}
.bigstars{display:flex;gap:6px;justify-content:center;margin:0 0 14px}
.bigstars svg{width:46px;height:46px}
.namebox{padding:28px 0 140px;text-align:center}
.namebox img{width:150px;height:150px;object-fit:contain}
.namebox h1{font-size:26px;font-weight:900;margin:8px 0 6px}
.namebox p{color:var(--ink2);font-size:16px;margin:0 0 18px}
.namebox input{width:100%;font:inherit;font-size:22px;font-weight:800;color:var(--ink);padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--soft);outline:none;text-align:center;caret-color:var(--purple)}
.namebox input:focus{border-color:var(--purple);background:#fff}
.cert{margin:12px 0 0;border-radius:24px;border:3px solid var(--purple);padding:18px 16px 16px;background:linear-gradient(180deg,var(--purple-bg),#fff 45%)}
.cert .who{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cert .who img{width:76px;height:76px;object-fit:contain;flex:none}
.cert .nm{font-size:24px;font-weight:900;line-height:1.15}
.cert .cl{color:var(--ink2);font-size:15px}
.cert ul{list-style:none;margin:0;padding:0;border-top:2px solid var(--line)}
.cert li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:2px solid var(--line);font-size:17px}
.cert li .nm2{flex:1}
.cert li .st{display:flex;gap:1px}
.cert li .st svg{width:20px;height:20px}
.cert li .no{color:#a3a8bf;font-size:15px}
.cert li .tm{color:var(--ink2);font-size:13px;width:74px;text-align:right}
.cert .sum{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:space-between;align-items:center;margin-top:12px;font-size:17px;font-weight:900}
.cert .sum span{white-space:nowrap}
.cert .sum .big{font-size:18px;color:var(--green-d)}
.cert .sum .big.not{color:var(--orange)}
.cert .now{margin-top:8px;color:var(--ink2);font-size:14px;text-align:center}
.shot{display:flex;gap:10px;align-items:center;background:var(--blue-bg);color:var(--blue-d);border-radius:16px;padding:10px 14px;font-size:16px;line-height:1.35}
.homebtns{display:flex;flex-direction:column;gap:12px;margin:10px 0 0}
canvas.conf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
/* ---------- анимации и мемы ---------- */
.hello img{animation:bob 2.6s ease-in-out infinite}
.node.next{animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}
.sheet .row img.jump{animation:jump .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes jump{0%{transform:translateY(30px) scale(.6)}60%{transform:translateY(-12px) scale(1.1)}100%{transform:none}}
.sheet .row img.wobble{animation:wobble .7s}
@keyframes wobble{20%{transform:rotate(-12deg)}45%{transform:rotate(9deg)}70%{transform:rotate(-5deg)}100%{transform:none}}
.sheet .row img.six7{animation:six7 .5s ease-in-out 3}
@keyframes six7{25%{transform:translateY(-8px) rotate(-8deg)}75%{transform:translateY(-8px) rotate(8deg)}}
img.ph{border-radius:50%;object-fit:cover!important;border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.joke{margin:2px 0 8px;font-size:16px;font-weight:900;line-height:1.3;color:var(--ink);background:rgba(255,255,255,.75);border-radius:12px;padding:7px 11px;display:inline-block}
.combo .fire{display:inline-block;animation:pulse .5s}
@keyframes pulse{40%{transform:scale(1.18)}}
.boss-mini img{width:40px;height:40px;object-fit:contain;display:block}
.boss-mini.hit{animation:hit .55s}
@keyframes hit{15%{transform:translateX(-6px) rotate(-10deg);filter:brightness(1.6) saturate(.4)}40%{transform:translateX(6px) rotate(8deg)}65%{transform:translateX(-3px)}100%{transform:none}}
.cher{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px auto 0;max-width:360px;background:var(--soft);border-radius:16px;padding:8px 12px;font-size:15px;text-align:left}
.done-screen .cher img{width:56px;height:56px;flex:none}
.flyer{position:fixed;top:52%;left:0;z-index:30;display:flex;align-items:center;gap:8px;pointer-events:none;animation:fly 4.2s cubic-bezier(.3,.7,.7,.3) forwards}
.flyer img{width:120px;height:120px;object-fit:contain;flex:none}
.flyer .em{font-size:60px;line-height:1}
.flyer .t{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:15px;line-height:1.3;width:210px;box-shadow:0 4px 0 var(--line)}
@keyframes fly{0%{transform:translateX(-100%) rotate(-8deg)}30%,70%{transform:translateX(calc(50vw - 50%)) rotate(0)}100%{transform:translateX(100vw) rotate(6deg)}}
.testtag{font-size:12px;font-style:normal;color:#fff;background:var(--red);border-radius:8px;padding:2px 7px;vertical-align:middle;letter-spacing:.05em}
.testbar{display:flex;gap:6px;margin:4px 0 8px}
.testbar button{flex:1;font-size:13px;font-weight:900;padding:7px 4px;border-radius:10px;border:2px dashed var(--red);color:var(--red-ink);background:var(--red-bg)}
.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pop{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.prompt{font-size:20px}.bigeq{font-size:26px}.scene img{width:84px;height:84px}.opt{font-size:19px}}

/* ---------- английская игра: своё ---------- */
:root{--web:#1f3a93;--web-d:#15297a;--spidey:#e23636;--spidey-d:#b81f1f}
body{background:var(--bg)}
.logo{color:var(--spidey);white-space:nowrap;min-width:0} .logo i{color:var(--web);font-style:normal}
@media (max-width:380px){.logo{font-size:19px}.logo.t i{display:none}}   /* тест учителя: «Meow ТЕСТ», иначе метка наезжает на звёзды */
.mascot{width:118px;height:118px;flex:none;object-fit:contain}
.hint .mascot{width:52px;height:52px}
.cher .mascot{width:56px;height:56px}
.cert .who .mascot{width:76px;height:76px}
.flyer .mascot{width:120px;height:120px}
.hello .mascot{animation:bob 2.6s ease-in-out infinite}
.intro .robo .mascot,.sheet .row .mascot{width:92px;height:92px}
.sheet .row .mascot{width:74px;height:74px;margin-top:-34px}
.scene .mascot{width:104px;height:104px}
.done-screen .mascot{width:170px;height:170px}
.namebox .mascot{width:120px;height:120px}
.sheet .row .mascot.jump{animation:jump .6s cubic-bezier(.2,1.6,.4,1)}
.sheet .row .mascot.wobble{animation:wobble .7s}
.sheet .row .mascot.six7{animation:six7 .5s ease-in-out 3}

/* кнопка «слушай» */
.listen{display:flex;flex-direction:column;align-items:center;gap:10px;margin:4px 0 18px}
.play{width:112px;height:112px;border-radius:50%;background:var(--web);color:#fff;display:grid;place-items:center;
  box-shadow:0 6px 0 var(--web-d);transition:transform .08s,box-shadow .08s}
.play:active{transform:translateY(5px);box-shadow:0 1px 0 var(--web-d)}
.play svg{width:52px;height:52px}
.play.on{background:var(--spidey);box-shadow:0 6px 0 var(--spidey-d)}
.listen .again,.sheet .again{color:var(--web);font-size:15px;font-weight:900;padding:6px 10px;display:inline-flex;align-items:center;gap:6px}
.again svg{width:18px;height:18px;flex:none}
.listen .cnt{color:var(--ink2);font-size:14px;font-weight:700}

/* картинки как варианты ответа */
.picopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.picopt{border-radius:18px;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);background:#fff;padding:6px;overflow:hidden}
.picopt img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--soft)}
.picopt span{display:block;font-size:15px;font-weight:900;padding:6px 2px 2px;color:var(--ink2)}
.picopt.sel{border-color:var(--blue);box-shadow:0 4px 0 var(--blue);background:var(--blue-bg)}
.picopt.sel span{color:var(--blue-d)}
.picopt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}

/* поле для набора слова */
.tin{width:100%;font:inherit;font-size:26px;font-weight:900;color:var(--ink);padding:14px 16px;border-radius:16px;
  border:2px solid var(--line);background:var(--soft);outline:none;text-align:center;caret-color:var(--web);letter-spacing:.02em}
.tin:focus{border-color:var(--web);background:#fff}
.tinhelp{text-align:center;color:var(--ink2);font-size:15px;margin:8px 0 0}
.ru{color:var(--ink2);font-size:17px;font-weight:700;text-align:center;margin:0 0 12px}
.gapline{font-size:24px;line-height:1.35;font-weight:900;text-align:center;margin:0 0 16px;text-wrap:balance}
.gapline u{text-decoration:none;color:var(--web);border-bottom:4px dotted var(--web);padding:0 10px}
.songbtn{background:var(--spidey);box-shadow:0 4px 0 var(--spidey-d)}
.whoami{display:flex;flex-direction:column;gap:8px;max-width:420px;margin:0 auto}
.whoami button{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);
  box-shadow:0 4px 0 var(--line);background:#fff;font-size:20px;font-weight:900}
.whoami button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.whoami .btn{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);text-align:center}
.sent{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--ink2);font-size:14px;margin-top:10px}
.sent b{color:var(--green-d)} .sent.wait b{color:var(--orange)}
/* глава 2b: картинки слов (файл или эмодзи) */
.wshow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:var(--soft);border-radius:18px;padding:12px;margin:0 0 14px;min-height:96px}
.wps{display:inline-flex;align-items:center;gap:2px}
.wps .emj{font-size:52px;line-height:1.1}
.wps.n2 .emj,.wps.n3 .emj{font-size:40px}
.wshow.big .emj{font-size:84px}
/* картинки урока 20.10 — 3:2 с праздничным фоном; «много» — одна картинка, где их ровно столько */
.wps img.w2{display:block;width:100%;aspect-ratio:3/2;height:auto;object-fit:cover;border-radius:12px}
.wshow .wps.im{flex:1 1 0;min-width:0;max-width:300px}.wshow.big .wps.im{max-width:360px}
.wps.im{display:flex}.wps.im img.w2{flex:1 1 0;min-width:0}.wshow .wps.n2.im,.wshow .wps.n3.im{flex-grow:1.6;max-width:420px;gap:4px}
.wshow .arr{font-size:30px;font-weight:900;color:var(--ink2)}
.wbox{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;background:var(--soft);border-radius:12px}
.picopt .wbox{display:flex;padding:0}.picopt .wps{display:inline-flex;padding:0}.picopt .emj{display:inline;padding:0;color:inherit}
.wbox .emj{font-size:60px}.wbox .n2 .emj{font-size:44px}.wbox.im{aspect-ratio:3/2;overflow:hidden}.wbox .wps.im{width:100%}.wbox img.w2{border-radius:0}
/* выбор главы */
.chs{display:flex;flex-direction:column;gap:16px;margin:8px 0 22px}
.chbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px 16px;border-radius:22px;color:#fff;
  background:var(--c);box-shadow:0 6px 0 var(--cd);transition:transform .08s,box-shadow .08s}
.chbtn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--cd)}
.chbtn .big{font-size:40px;font-weight:900;line-height:1;flex:none;width:68px;height:68px;border-radius:18px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.chbtn .t{flex:1;min-width:0}.chbtn .t b{display:block;font-size:24px;line-height:1.15}
.chbtn .t small{display:block;font-size:14px;opacity:.92;margin-top:4px;font-weight:700}
.chbtn .pr{display:flex;align-items:center;gap:4px;font-size:15px;margin-top:8px;font-weight:900}.chbtn .pr .ic{width:18px;height:18px}
.chback{display:inline-flex;align-items:center;gap:6px;color:var(--web);font-weight:900;font-size:16px;padding:12px 0 0}
.cert li.chhead{display:block;font-size:13px;color:var(--ink2);font-weight:900;text-transform:uppercase;letter-spacing:.05em;padding:10px 2px 4px;border-bottom:2px solid var(--line)}
@media (max-width:380px){.chbtn .t b{font-size:21px}.chbtn .big{width:56px;height:56px;font-size:32px}}
@media (max-width:380px){.play{width:96px;height:96px}.picopt span{font-size:14px}.gapline{font-size:21px}}
/* глава 2b: «Учим песню» — как экран стиха в poem5 */

.learnsong .t{flex:1;min-width:0}.learnsong b{display:block;font-size:20px}.learnsong small{display:block;font-size:14px;font-weight:700;opacity:.95}
.stop{position:sticky;top:0;z-index:6;background:var(--bg);padding:0 0 8px;margin:0 -2px}

.simg img{width:100%;height:100%;object-fit:cover;display:block}
.ptitle{font-size:24px;font-weight:900;margin:8px 0 6px;text-align:center}
.pbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 10px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:15px;font-weight:900;color:var(--ink);box-shadow:0 3px 0 var(--line)}

.chip.big.on{background:var(--spidey);border-color:var(--spidey);box-shadow:0 3px 0 var(--spidey-d)}
.steps{display:flex;gap:4px;margin:0 0 4px}
.steps button{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:6px 2px;font-size:12px;font-weight:900;color:var(--ink2);background:#fff;line-height:1.15}
.steps button.on{border-color:var(--orange);background:#fff3e6;color:#b35400}
.stepsl{font-size:13px;color:var(--ink2);text-align:center;margin:0 0 6px}
.ssec{font-size:12px;font-weight:900;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 2px 8px}
.pl{display:flex;gap:10px;align-items:flex-start;padding:10px 8px;border-radius:16px;transition:background .2s}
.pl.cur{background:#fff6d6;box-shadow:inset 0 0 0 2px var(--gold)}
.pl .lp{flex:none;width:40px;height:40px;border-radius:50%;background:var(--web);color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--web-d)}

.tips{background:var(--blue-bg);border-radius:18px;padding:12px 14px;margin:14px 0 0;font-size:15px;line-height:1.4}
.tips h3{margin:0 0 6px;font-size:17px;color:var(--blue-d)}.tips ol{margin:0;padding-left:20px}.tips li{margin:3px 0}
.echo{background:var(--spidey);color:#fff;border-radius:14px;padding:8px 12px;margin:0 0 4px;font-weight:900;display:flex;align-items:center;gap:10px}
.echo .eb{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.35);overflow:hidden}
.echo .eb i{display:block;height:100%;width:0;background:#fff}
.echo button{color:#fff;font-weight:900;border:2px solid #fff;border-radius:10px;padding:2px 8px}

function pic(k,cls=''){
  const s=PICS[k]||PICS.hi;
  return `<img class="mascot ${cls}" src="${s[0]}" data-s="${s.join('|')}" data-i="0" alt="" onerror="nextPic(this)">`;

function nextPic(el){const s=el.dataset.s.split('|'),i=+el.dataset.i+1;
  if(i<s.length){el.dataset.i=i;el.src=s[i]}else el.style.visibility='hidden'}

  f.innerHTML=`${pic('bomb')}<span class="t">${esc(text)}</span>`;

const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>esc(s).replace(/___/g,'<u>&nbsp;&nbsp;&nbsp;</u>');
const take=(a,n)=>shuf(a).slice(0,n);
function choice(o){const opts=shuf(o.opts);return {...o,type:'choice',opts,correct:opts.indexOf(o.opts[0])}}

const wimg=k=>B+WK[k].img, wsay=k=>B+WK[k].w, wex=k=>B+WK[k].x;
const PAIRS=[['russia','russian'],['theuk','british'],['theusa','american'],['canada','canadian'],
 ['australia','australian'],['newzealand','newzealander'],['france','french'],['japan','japanese']];
const COUNTRIES=PAIRS.map(p=>p[0]), NATS=PAIRS.map(p=>p[1]);
// ⚠️ New Zealand — единственная страна этого списка БЕЗ прилагательного: «New Zealander» —

function haveQ(s,o,neg,book){
  const base=s[1]==='have'?'have got':'has got';
  const right=neg?base.replace('have','haven’t').replace('has','hasn’t').replace('’','\'') : base;
  const good=neg?(s[1]==='have'?"haven't got":"hasn't got"):base;
  return choice({qid:good,book,pol:neg?'no':'yes',
    prompt:`${s[0]} ___ ${o[0]}.`,
    ru:`${s[2]} ${neg?'нет':'есть'}: ${o[1]}`,
    opts:[good,...FORMS.filter(f=>f!==good)],
    why:WHYF[good],
    hint:neg?'Отрицание: have → haven’t, has → hasn’t. Кто подлежащее?':'He, she, it — has. Все остальные — have.'});
}
function lvlHave(neg,book0){

  const objs=shuf(OBJ);
  const first=haveQ(SUBJ[0],OBJ[neg?1:0],neg,book0);
  return [first,...shuf(subs).map((s,i)=>haveQ(s,objs[i%objs.length],neg)).slice(0,7)];

// громкость включалась сразу на полную (setValueAtTime(vol)) — на телефоне это слышно как щелчок-удар,
// а удар в начале и есть то, чем обычно звучит ошибка. Теперь у каждой нотки мягкая атака (env)
// и затухание в ноль. «Верно» — вверх и тише, «ошибка» — вниз (sBad): спутать нельзя.
function env(g,t,dur,vol){
  g.gain.setValueAtTime(.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+Math.min(.014,dur*.35));
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
}
function tone(freqs,dur=.12,type='sine',vol=.15){
  const c=actx();if(!c)return;
  let t=c.currentTime;
  freqs.forEach(f=>{const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;
    env(g,t,dur,vol);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.03);t+=dur*.8});
}

  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);env(g,t,dur,vol);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur,f0,f1,vol=.25,at=0){const c=actx();if(!c)return;const t=c.currentTime+at,n=c.createBufferSource(),b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;n.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=c.createGain();g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(vol,t+dur*.4);g.gain.exponentialRampToValueAtTime(.001,t+dur);n.connect(f).connect(g).connect(c.destination);n.start(t)}

  const N={C4:262,D4:294,E4:330,F4:349,G4:392,A4:440,B4:494,C5:523,D5:587,E5:659,F5:698,G5:784,A5:880,C6:1047};

             ['E5',1],['G5',1],['C6',2],['A5',1],['C6',1],['G5',2],['F5',1],['E5',1],['D5',1],['G5',1],['C6',4]];
  const bass=[['C4',4],['C4',4],['F4',4],['G4',4],['C4',4],['F4',4],['G4',4],['C4',4]];
  const q=.19;let t=0;
  mel.forEach(([n,l])=>{slide(N[n],N[n],l*q*.95,'triangle',.15,t);t+=l*q});
  t=0;bass.forEach(([n,l])=>{slide(N[n]/2,N[n]/2,l*q*.9,'sine',.13,t);t+=l*q});
}

// ====== глава 2b: «Учим песню» — подход экрана стиха из «Get a Five!» (poem5) ======
// Одна mp3 на всю песню (SONG2B, song2b.js): строчка = кусок [t, t1]. Картинка сверху меняется
// на считаемом слове (ph), как караоке урока 20.10: «One bike —» одна, «two bikes!» — две.
const SHIDE=['Все слова','Прячем половину','Первые буквы','Только картинки'];
const SSEC={'Intro':'Вступление','Verse 1':'Куплет 1','Verse 2':'Куплет 2','Chorus':'Припев','Bridge':'Мостик','Outro':'Конец'};
let SA=null,SP=null,SV={hide:0,tr:1};
// конец строчки: после последнего слова бывает проигрыш — режем через 1,8 с (последнее слово тянут)
const songEnd=l=>Math.min(l.t1,l.w[l.w.length-1][1]+1.8);
function songImg(l,t){let s=l.img;(l.ph||[]).forEach(([pt,p])=>{if(t>=pt-0.05)s=p});return s}
function songMask(x,lvl,gi,first,n){
  if(lvl===0||lvl===3||first)return null;
  if(lvl===1&&!n&&gi%2!==1)return null;          // половина: каждое второе + все «много»
  const fl=lvl===2;
  return esc(x).replace(/[A-Za-z’']+/g,m=>`${fl?m[0]:''}<i>${fl?m.slice(1):m}</i>`);
}
function songStop(){
  if(SP){clearTimeout(SP.tm);cancelAnimationFrame(SP.raf);SP=null}
  if(SA)SA.pause();
  app.querySelectorAll('.pl').forEach(p=>p.classList.remove('cur'));
  app.querySelectorAll('.w.sung').forEach(w=>w.classList.remove('sung'));
  ['sall','secho'].forEach(id=>{const b=document.getElementById(id);if(b)b.classList.remove('on')});
  const bar=document.getElementById('echobar');if(bar)bar.innerHTML='';
}
function songScreen(keep){
  songStop();if(!keep)SV={hide:0,tr:1};
  const S=SONG2B,lvl=SV.hide;
  if(!SA){SA=new Audio(S.src);SA.preload='auto'}
  [...new Set(S.lines.flatMap(l=>[l.img,...(l.ph||[]).map(p=>p[1])]))].forEach(src=>{const im=new Image();im.src=src});
  let sec='',html='';
  S.lines.forEach((l,i)=>{
    if(l.sec!==sec){sec=l.sec;html+=`<div class="ssec">${SSEC[sec]||esc(sec)}</div>`}
    let gi=0,first=true;
    const en=l.w.map(([x,t,n],j)=>{
      if(/^[—–-]$/.test(x))return `<span>${x}</span>`;
      const m=songMask(x,lvl,gi++,first,n);first=false;
      return `<span class="w${n?' n':''}${m?' m':''}" data-j="${j}">${m||esc(x)}</span>`;
    }).join(' ');
    html+=`<div class="pl" id="sl${i}"><div><button class="lp" data-l="${i}" aria-label="Слушать строчку ${i+1}">${IC.playic}</button></div>
      <div class="tx">${lvl===3?`<img class="thumb" src="${l.img}" alt="" data-l="${i}">`:''}
      <div class="en${lvl===3?' hid':''}">${en}</div>${SV.tr?`<p class="ru">${esc(l.ru)}</p>`:''}</div></div>`;
  });
  app.innerHTML=`<div class="wrap"><div class="lbar"><button class="iconbtn" id="x" aria-label="Назад">${IC.close}</button></div>
    <div class="stop"><div class="simg"><img id="simg" src="${S.cover}" alt=""></div><div id="echobar"></div></div>
    <h1 class="ptitle">🎵 ${esc(S.title)}</h1>
    <div class="pbar">
      <button class="chip big" id="sall">▶ Вся песня</button>
      <button class="chip big" id="secho">🎤 Пой за мной</button>
      <button class="chip ${SV.tr?'on':''}" id="str">Перевод</button>
    </div>
    <div class="steps">${SHIDE.map((h,i)=>`<button class="${i===lvl?'on':''}" data-h="${i}">${i}<br>${h}</button>`).join('')}</div>
    <p class="stepsl">${lvl===3?'Смотри на картинку и пой. Забыл(а) — нажми на картинку.':'Выучил(а)? Спрячь слова. Забыл(а) — нажми на слово.'}</p>
    ${html}
    <div class="tips"><h3>Как выучить</h3><ol>
      <li>Нажми «▶ Вся песня» и читай перевод.</li>
      <li>Нажми «🎤 Пой за мной» и пой <b>вслух</b> в паузах.</li>
      <li>Спрячь слова (1 → 2 → 3) и пой сам(а). <b>Подчёркнутые</b> слова — «много»: two bikes, three mice.</li></ol></div>
    <div style="height:140px"></div></div>
    <div class="bottom"><div class="wrap"><button class="btn" id="done" style="background:var(--green);box-shadow:0 4px 0 var(--green-d)">Я выучил(а) песню!</button></div></div>`;
  const pic0=document.getElementById('simg');
  const show=(i,t)=>{
    const l=S.lines[i];if(!l)return;
    const src=songImg(l,t);if(pic0.getAttribute('src')!==src)pic0.setAttribute('src',src);
    const el=document.getElementById('sl'+i);
    if(!el.classList.contains('cur')){app.querySelectorAll('.pl.cur').forEach(p=>{p.classList.remove('cur');p.querySelectorAll('.sung').forEach(w=>w.classList.remove('sung'))});
      el.classList.add('cur');if(SP&&SP.mode!=='one')el.scrollIntoView({block:'center',behavior:'smooth'})}
    el.querySelectorAll('.w').forEach(w=>w.classList.toggle('sung',t>=l.w[+w.dataset.j][1]-0.05));
  };
  // ⚠️ пока песня не загрузилась, currentTime сбрасывается в 0 — тогда перематываем по loadedmetadata (как в poem5)
  const seek=x=>{if(SA.readyState>=1)SA.currentTime=x;else SA.addEventListener('loadedmetadata',()=>{SA.currentTime=x},{once:true})};
  const start=(mode,i)=>{
    const st=SP={mode,i,tm:0,raf:0,go:0};
    seek(Math.max(0,S.lines[i].t-0.1));
    SA.play().catch(()=>{});
    const tick=()=>{
      if(SP!==st)return;
      const t=SA.currentTime;
      if(t<S.lines[st.i].t-0.6&&!st.go){st.raf=requestAnimationFrame(tick);return}   // ещё не перемотали
      st.go=1;
      if(mode==='all'){let k=0;S.lines.forEach((l,j)=>{if(t>=l.t-0.15)k=j});st.i=k}
      show(st.i,t);
      const l=S.lines[st.i];
      if(mode==='all'&&(SA.ended||t>=S.end)){songStop();confetti();return}
      if(mode!=='all'&&t>=songEnd(l)-0.05){SA.pause();
        if(mode==='one')return songStop();
        // «Пой за мной»: пауза = длина строчки × 1,3 + 1 с
        const ms=Math.round((songEnd(l)-l.t)*1300+1000),bar=document.getElementById('echobar');
        bar.innerHTML=`<div class="echo">🎤 Твоя очередь!<span class="eb"><i style="transition:width ${ms}ms linear"></i></span><button id="es">Стоп</button></div>`;
        document.getElementById('es').onclick=()=>songStop();
        requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=bar.querySelector('.eb i');if(b)b.style.width='100%'}));
        st.tm=setTimeout(()=>{if(SP!==st)return;bar.innerHTML='';
          if(st.i+1>=S.lines.length)return songStop();
          st.i++;st.go=0;seek(Math.max(0,S.lines[st.i].t-0.1));SA.play().catch(()=>{});st.raf=requestAnimationFrame(tick)},ms);
        return}
      st.raf=requestAnimationFrame(tick);
    };
    st.raf=requestAnimationFrame(tick);
  };
  document.getElementById('x').onclick=()=>{songStop();home()};
  document.getElementById('str').onclick=()=>{sTap();SV.tr=SV.tr?0:1;songScreen(true)};
  app.querySelectorAll('.steps button').forEach(b=>b.onclick=()=>{sTap();SV.hide=+b.dataset.h;songScreen(true)});
  app.querySelectorAll('.lp').forEach(b=>b.onclick=()=>{songStop();start('one',+b.dataset.l)});
  document.getElementById('sall').onclick=e=>{const on=SP&&SP.mode==='all';songStop();if(!on){e.currentTarget.classList.add('on');start('all',0)}};
  document.getElementById('secho').onclick=e=>{const on=SP&&SP.mode==='echo';songStop();if(!on){e.currentTarget.classList.add('on');start('echo',0)}};
  app.querySelectorAll('.w.m').forEach(w=>w.onclick=()=>{w.classList.add('peek');setTimeout(()=>w.classList.remove('peek'),2500)});
  app.querySelectorAll('.thumb').forEach(im=>im.onclick=()=>{const e=im.parentNode.querySelector('.en');e.classList.add('peek');setTimeout(()=>e.classList.remove('peek'),3000)});
  document.getElementById('done').onclick=()=>{songStop();const first=!save.song;save.song=Date.now();if(first)save.xp+=10;store();sWin();confetti();home()};
  if(!keep)window.scrollTo(0,0);
}

let L;
function lesson(i){
  const u=UNITS[i],qs=u.make();CH=u.ch;
  L={u,i,queue:qs,total:qs.length,ok:0,mist:0,hearts:u.boss?3:null,combo:0,best:0,bad:0,t0:Date.now(),wrong:[],seen:new Set()};
  ask();
  if(u.boss)setTimeout(()=>{if(L&&L.u.boss&&document.getElementById('chk'))
    flyer(u.fly||'Бомбардиро Крокодило летел мимо, увидел твой have got — и испугался!')},700);

function ask(){
  if(!L.queue.length)return finish();
  const q=L.q=L.queue[0];L.ans=q.type==='build'?[]:null;L.hintShown=false;L.locked=false;
  const pct=Math.round(L.ok/L.total*100);

    body+=`<div class="picopts">${q.opts.map((k,i)=>`<button class="picopt" data-o="${i}"><img src="${wimg(k)}" alt="" onerror="this.style.visibility='hidden'"><span>${i+1}</span></button>`).join('')}</div>`;

  }else if(q.type==='choice'){

  }else if(q.type==='build'){

      <p class="tinhelp">Большие буквы не важны.</p>`;

  body+=`<button class="hintbtn" id="hb">${IC.bulb}Подсказка</button><div id="hint"></div>`;

  <div class="wrap">

      ${L.hearts!==null?`<div class="hearts">${IC.heart}${L.hearts}</div>`:''}</div>
    <div class="combo"><span class="${L.combo>=3?'fire':''}">${L.combo>=3?`${L.combo} подряд — огонь!`:''}</span></div>
    ${TEST?'<div class="testbar"><button id="tOk">✓ Верно</button><button id="tBad">✗ Ошибка</button><button id="tWin">⏭ Весь уровень</button></div>':''}

  <div class="sheet" id="sh"></div>`;
  document.getElementById('x').onclick=()=>yesNo('Выйти из уровня?','Выйти',home);
  document.getElementById('chk').onclick=check;

    document.getElementById('tBad').onclick=()=>testAnswer(false);
    document.getElementById('tWin').onclick=()=>{L.queue=[L.queue[0]];L.total=L.ok+1;testAnswer(true)};
  }
  document.getElementById('hb').onclick=()=>{if(L.hintShown)return;L.hintShown=true;sTap();
    document.getElementById('hint').innerHTML=`<div class="hint pop">${pic('think')}<span>${esc(q.hint||'Послушай ещё раз.')}</span></div>`};
  if(q.audio){
    const pl=document.getElementById('pl');
    const go=()=>{sTap();speak(q.audio,pl)};
    pl.onclick=go;document.getElementById('ag').onclick=go;
    if(audioOk)setTimeout(go,350);
  }
  if(q.type==='choice'){
    const sel=q.pics||q.emo?'.picopt':'.opt';
    app.querySelectorAll(sel).forEach(b=>b.onclick=()=>{sTap();L.ans=+b.dataset.o;app.querySelectorAll(sel).forEach(o=>o.classList.toggle('sel',o===b));ready()});
  }else if(q.type==='build'){
    app.querySelectorAll('.bank .tile').forEach(b=>b.onclick=()=>{sTap();L.ans.push(+b.dataset.t);b.classList.add('used');drawLine()});
  }else{
    const t=document.getElementById('tin');
    t.oninput=()=>{L.ans=t.value;ready()};
    t.onkeydown=e=>{if(e.key==='Enter'&&!document.getElementById('chk').disabled){e.preventDefault();t.blur();check()}};
  }
  window.scrollTo(0,0);
}
function drawLine(){
  const line=document.getElementById('line'),q=L.q;
  line.classList.toggle('empty',!L.ans.length);
  line.innerHTML=L.ans.map((k,p)=>`<button class="tile" data-p="${p}" style="font-size:19px">${esc(q.tiles[k])}</button>`).join('');
  line.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const k=L.ans.splice(+b.dataset.p,1)[0];app.querySelector(`.bank .tile[data-t="${k}"]`).classList.remove('used');drawLine()});
  ready();
}
function ready(){const q=L.q;let ok;
  if(q.type==='build')ok=L.ans.length>0; else if(q.type==='text')ok=String(L.ans||'').trim().length>0; else ok=L.ans!==null;
  document.getElementById('chk').disabled=!ok}
const norm=s=>String(s).toLowerCase().replace(/’/g,"'").replace(/[.,!?;:]+$/,'').replace(/\s+/g,' ').trim();
function isRight(){
  const q=L.q;
  if(q.type==='choice')return L.ans===q.correct;
  if(q.type==='build')return q.accept.some(a=>norm(a)===norm(L.ans.map(k=>q.tiles[k]).join(' ')));
  return q.accept.some(a=>norm(a)===norm(L.ans));
}
function rightText(){const q=L.q;return esc(q.type==='choice'?(q.pics?WK[q.opts[q.correct]].en:q.emo?W2K[q.opts[q.correct]].en:q.opts[q.correct]):q.accept[0])}
function testAnswer(right){
  if(L.locked)return;const q=L.q;
  if(q.type==='choice')L.ans=right?q.correct:(q.correct+1)%q.opts.length;
  else if(q.type==='text')L.ans=right?q.accept[0]:'zzz';
  else if(right){const used=new Set();L.ans=(q.right||q.accept[0].split(' ')).map(t=>{const k=q.tiles.findIndex((x,i)=>x===t&&!used.has(i));used.add(k);return k})}
  else L.ans=q.tiles.map((t,k)=>k);
  check();
}
function check(){
  const q=L.q,good=isRight();L.locked=true;
  const sh=document.getElementById('sh');
  L.queue.shift();
  if(!L.seen.has(q)){L.seen.add(q);if(!good&&q.qid)L.wrong.push(q.qid)}
  let face=good?'yes':'oops',fcls=good?'jump':'wobble',joke='',cherPic='';
  if(good){L.ok++;L.combo++;L.bad=0;L.best=Math.max(L.best,L.combo);
    if(L.combo===6||L.combo===7){s67();face='six7';fcls='six7';joke='Сикс-севен подряд! 🤷 Засчитано.'}
    else if(L.combo>=3)sCombo(L.combo);else sGood();
  }else{
    L.mist++;L.combo=0;L.bad++;sBad();
    if(L.hearts!==null)L.hearts--;
    L.queue.push(q);
    document.getElementById('qb').classList.add('shake');
    if(L.bad>=3)joke='Не переживай, это всего лишь двойка будет, если ты не соберёшься 😼';
    else if(Math.random()<.5){joke='Черемша сочувствует. Попробуй ещё!';cherPic=pic('cherSad','ph wobble')}
  }
  const praise=pick(['Отлично!','Верно!','Супер!','Точно!','Так держать!']);
  sh.className='sheet '+(good?'ok':'bad');
  sh.innerHTML=`<div class="wrap"><div class="row">${cherPic||pic(face,fcls)}<div style="flex:1">
    <h3>${good?IC.check+praise:IC.cross+'Почти!'}</h3>
    ${joke?`<p class="joke">${joke}</p>`:''}
    <p class="why">${good?q.why:`Правильно: <b>${rightText()}</b>.<br>${q.why}`}</p>
    ${q.audio?`<button class="again" id="ag2">${IC.waveic} послушать ещё раз</button>`:''}</div></div>
    <button class="btn" id="nx">${!good&&L.hearts===0?'Ой…':'Дальше'}</button></div>`;
  document.getElementById('bt').style.visibility='hidden';
  requestAnimationFrame(()=>sh.classList.add('show'));
  const p=app.querySelector('.prog i');if(p)p.style.width=Math.max(Math.round(L.ok/L.total*100),3)+'%';
  const h=app.querySelector('.hearts');if(h)h.innerHTML=IC.heart+L.hearts;
  const a2=document.getElementById('ag2');if(a2)a2.onclick=()=>speak(q.audio);
  document.getElementById('nx').onclick=()=>{L.locked=false;if(L.hearts===0)return lost();ask()};
  document.getElementById('nx').focus({preventScroll:true});
}
function lost(){
  app.innerHTML=`<div class="wrap"><div class="done-screen">${pic('oops')}
    <h1 style="color:var(--red)">Сердечки кончились</h1><p>${L.u.ch==='2b'?'Микс':'Стена'} в этот раз победил${L.u.ch==='2b'?'':'а'}. Кот Икс не расстроился — повтори правило и попробуй снова!</p></div></div>
    <div class="bottom"><div class="wrap" style="display:flex;flex-direction:column;gap:12px">
    <button class="btn red" id="again">Ещё раз</button><button class="btn ghost" id="hm">На карту</button></div></div>`;
  document.getElementById('again').onclick=()=>lesson(L.i);
  document.getElementById('hm').onclick=home;
}
function finish(){
  const first=L.total,acc=Math.round(first/(first+L.mist)*100);
  const stars=L.mist===0?3:L.mist<=2?2:1;
  const xp=10+first+(L.u.boss?20:0)+(stars===3?5:0);
  const sec=Math.round((Date.now()-L.t0)/1000);
  save.xp+=xp;save.u[L.u.id]=Math.max(save.u[L.u.id]||0,stars);save.t=save.t||{};save.t[L.u.id]=Date.now();store();
  queueResult({pupil:save.pupil,level:L.u.id,levelName:(L.u.ch==='2b'?'2b · ':'')+L.u.name,stars,sec,mist:L.mist,wrong:L.wrong,at:new Date().toISOString()});
  app.innerHTML=`<div class="wrap"><div class="done-screen">${pic('win')}
    <h1>${L.u.boss?(L.u.ch==='2b'?'Микс пройден!':'Стена взята!'):'Уровень пройден!'}</h1>
    <p>${stars===3?'Ни одной ошибки — отлично.':L.mist?`Ошибок: ${L.mist}. Эти задания вернулись в конце и сделаны верно.`:''}</p>
    <div class="bigstars">${[1,2,3].map(k=>`<span class="pop" style="color:${k<=stars?'var(--gold)':'var(--line)'};animation-delay:${k*.15}s">${IC.star.replace('class="ic"','')}</span>`).join('')}</div>
    <div class="res"><div style="--c:var(--gold)"><b>Очки</b><span>${IC.bolt}+${xp}</span></div>
      <div style="--c:var(--green)"><b>Точность</b><span>${acc}%</span></div>
      <div style="--c:var(--blue)"><b>Время</b><span>${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}</span></div></div>
    ${L.best>=3?`<p>Лучшая серия: ${L.best} подряд!</p>`:''}
    ${L.u.boss?'<div class="cher">'+pic('cherLunch','ph')+`<span>${L.u.ch==='2b'?'Черемша довольна. Happy birthday, Spidey!':'Черемша довольна. Теперь — песня!'}</span></div>`:''}
  </div></div>
  <div class="bottom"><div class="wrap" style="display:flex;flex-direction:column;gap:12px">
    ${L.u.boss?(L.u.id==='boss'?'<a class="btn songbtn" href="../5m2a/5b/" style="text-align:center;text-decoration:none">🎵 Слушать песню Spidey</a>':'')+'<button class="btn blue" id="mn">Мой результат для учителя</button>':''}
    <button class="btn" id="hm">Продолжить</button></div></div>`;
  document.getElementById('hm').onclick=home;
  const mn=document.getElementById('mn');if(mn)mn.onclick=mine;
  if(L.u.boss){sSong();confetti();setTimeout(confetti,1600);setTimeout(confetti,3400)}else{sWin();confetti()}
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas');c.className='conf';document.body.appendChild(c);
  const x=c.getContext('2d'),W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio;
  const cols=['#e23636','#1f3a93','#ffbf1f','#3fbf2a','#1fa8f0','#ff5a8a'];
  const P=Array.from({length:140},()=>({x:W/2,y:H*.35,vx:(Math.random()-.5)*W*.03,vy:-Math.random()*H*.03-H*.008,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6,s:(Math.random()-.5)*.3}));
  let f=0;(function tick(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=H*.0009;p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.a+=p.s;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2*devicePixelRatio/1.5,p.r*devicePixelRatio/1.5);x.restore()});
    if(++f<160)requestAnimationFrame(tick);else c.remove()})();
}

// ====== кто ты (код из сообщения родителям) ======
// ⚠️ Код проверяется через интернет: списка кодов в игре нет и быть не должно.
// Один раз вошёл — код запомнен, дальше игра работает и без сети.
async function askName(next){
  app.innerHTML=`<div class="wrap"><div class="lbar"><button class="iconbtn" id="x" aria-label="Назад">${IC.close}</button></div>
    <div class="namebox">${pic('hi')}<h1>Твой код</h1>
    <p>Код прислали твоему родителю вместе со ссылкой. Четыре знака, большие буквы и цифры.</p>
    <input class="tin" id="cd" maxlength="6" inputmode="text" autocapitalize="characters" autocomplete="off"
      spellcheck="false" placeholder="Например: KRM7" value="">
    <p class="ru" id="err" style="color:var(--red);min-height:22px;margin:8px 0 0"></p>
    <button class="btn" id="ok" style="margin-top:4px">Войти</button></div></div>`;
  document.getElementById('x').onclick=home;
  const inp=document.getElementById('cd'),btn=document.getElementById('ok'),err=document.getElementById('err');
  const clean=v=>v.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
  inp.oninput=()=>{const c=inp.selectionStart;inp.value=clean(inp.value);inp.setSelectionRange(c,c);err.textContent=''};
  inp.onkeydown=e=>{if(e.key==='Enter')btn.click()};
  btn.onclick=async()=>{
    const code=clean(inp.value);
    if(code.length<3){err.textContent='Напиши код целиком.';return}
    if(TEST){save.pupil={id:'test:'+code.toLowerCase(),name:'Тест '+code};store();return next()}
    btn.disabled=true;const was=btn.textContent;btn.textContent='Проверяю…';
    let who=null;
    try{who=await whoIs(code)}catch(e){who=null}
    btn.disabled=false;btn.textContent=was;
    if(who==='нет'){err.textContent='Такого кода нет. Посмотри сообщение учителя ещё раз.';return}
    if(who==='много'){err.textContent='Слишком много попыток. Подожди час или спроси учителя.';return}
    if(!who){err.textContent='Нет интернета — код проверяется через сеть. Попробуй позже.';return}
    sTap();save.pupil={id:who.id,name:who.name};store();next();
  };
  inp.focus();
  window.scrollTo(0,0);
}

function mine(){
  const t=save.t||{},doneN=UNITS.filter(u=>save.u[u.id]).length,boss=!!save.u.boss,boss2=!!save.u['b-boss'];
  const waiting=(save.queue||[]).length;
  const d=ms=>{const x=new Date(ms);return x.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})+' '+x.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})};
  app.innerHTML=`<div class="wrap"><div class="lbar"><button class="iconbtn" id="x" aria-label="На карту">${IC.close}</button></div>
    <div class="shot">${IC.bulb}<span>Результат уходит учителю сам. Можно ещё сделать скриншот этого экрана.</span></div>
    <div class="cert">
      <div class="who">${pic(boss?'win':'hi')}<div><div class="nm">${esc((save.pupil||{}).name||'')}</div><div class="cl">5Б · Meow English · Module 2a + 2b</div>
        <button class="hintbtn" id="cn" style="padding:2px 0;margin:0;font-size:14px">Это не я</button></div></div>
      <ul>${UNITS.map((u,i)=>{const st=save.u[u.id]||0;return `${!i||UNITS[i-1].ch!==u.ch?`<li class="chhead">Глава ${u.ch} · ${CHS.find(c=>c.id===u.ch).title}</li>`:''}<li><span class="nm2">${u.name}</span>
        ${st?`<span class="st">${[1,2,3].map(k=>`<span style="color:${k<=st?'var(--gold)':'var(--line)'}">${IC.star}</span>`).join('')}</span><span class="tm">${t[u.id]?d(t[u.id]):''}</span>`:'<span class="no">не пройден</span>'}</li>`}).join('')}</ul>
      <div class="sum"><span>Пройдено: ${doneN} из ${UNITS.length}</span><span class="big ${boss?'':'not'}">${boss?'Стена взята':'Стена ждёт'}</span><span class="big ${boss2?'':'not'}">${boss2?'Микс пройден':'Микс ждёт'}</span></div>
      <div class="sum" style="margin-top:6px"><span>Очки</span><span style="color:var(--gold-d);display:flex;align-items:center;gap:4px">${IC.bolt}${save.xp}</span></div>
      <div class="now">Экран открыт: ${d(Date.now())}</div>
    </div>
    <div class="sent ${waiting?'wait':''}">${TEST?'<b>ТЕСТ</b> — ничего не отправляется':waiting?`<b>${waiting}</b> результат(ов) ждут сети`:'<b>Отправлено</b> учителю'}</div>
    <div style="height:130px"></div></div>
    <div class="bottom"><div class="wrap"><button class="btn" id="hm">На карту</button></div></div>`;
  document.getElementById('x').onclick=home;document.getElementById('hm').onclick=home;
  document.getElementById('cn').onclick=()=>askName(mine);
  flush();window.scrollTo(0,0);
}

addEventListener('keydown',e=>{
  if(!L||!document.getElementById('chk'))return;
  const sh=document.getElementById('sh');
  if(e.key==='Enter'){e.preventDefault();if(sh&&sh.classList.contains('show'))document.getElementById('nx').click();
    else if(!document.getElementById('chk').disabled)check();return}
  if(L.locked||L.q.type==='text')return;
  if(L.q.type==='choice'&&/^[1-4]$/.test(e.key)){const b=app.querySelector(`.opt[data-o="${+e.key-1}"],.picopt[data-o="${+e.key-1}"]`);if(b)b.click()}
});

flush();
home();
</script>
