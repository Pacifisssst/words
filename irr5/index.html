<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set 5 · три формы</title>
<style>body{font:22px/1.35 "Avenir Next",-apple-system,sans-serif;color:#111c37;background:#fffdf7;margin:0}main{max-width:820px;margin:auto;padding:18px 16px 40px}h1{font-size:30px;margin:.2em 0}
button{font:inherit;font-size:19px;padding:11px 16px;border:0;border-radius:10px;background:#111c37;color:#fff;margin:4px;cursor:pointer}button:disabled{opacity:.35}button:focus-visible{outline:3px solid #2f59ff;outline-offset:3px}
article{text-align:center;padding:18px 8px;border-block:1px solid #cbd2e0;margin:12px 0}img{width:100%;max-width:420px;aspect-ratio:1;object-fit:contain;border-radius:14px}
#word{font-size:40px;margin:.2em 0}.answer{font-size:32px;color:#11724a;font-weight:700;margin:.2em 0}.ex{font-size:22px;margin:.6em 0 .1em}.ex b{color:#0f7a3c;background:#dff5e6;border-radius:4px;padding:0 3px}.exru,.small{font-size:17px;color:#53617d}
[hidden]{display:none!important}.links a{display:inline-block;margin:4px 6px 4px 0;padding:8px 12px;border-radius:10px;background:#e8edff;color:#1d3bb3;text-decoration:none;font-size:17px;font-weight:600}
.song{background:#111c37;color:#fff;border-radius:14px;padding:12px 14px;margin-top:18px}.song audio{width:100%}.song p{margin:.2em 0;font-size:17px;color:#cfd8ef}.words{list-style:none;padding:0;margin:.4em 0 0}.words li{margin:.3em 0;font-size:18px}.words i{color:#cfd8ef}.words button{font-size:15px;padding:4px 8px;background:#2f59ff}.small a{color:#1d3bb3}</style>
<main><h1>Set 5 · вспомни → проверь → послушай</h1><p class="small">Модуль 2b · неправильные глаголы, set 5</p>
<p class="links"><a href="homework.pdf">📄 Домашнее задание (PDF для телефона)</a><a href="homework-print.pdf">🖨 Для печати</a></p>
<article><img id="pic" alt=""><h2 id="word"></h2><p id="ask">Назовите V2 и V3 вслух.</p>
<div id="answer" hidden><p class="answer" id="forms"></p><p id="ru"></p><button id="say">🔊 Три формы</button>
<p class="ex" id="ex"></p><p class="exru" id="exru"></p><button id="sayx">🔊 Пример</button></div>
<button id="show">Проверить</button></article>
<button id="prev">← Назад</button><button id="next">Дальше →</button> <span id="count"></span>
<p class="small">Сначала ответьте сами, потом откройте ответ и послушайте. Space — ответ, → / ← — карточки. Три подхода по 5 минут в разные дни.</p>

</main><script>const CARDS=[{"word": "keep", "answer": "keep – kept – kept", "ru": "хранить, держать · ee → e + t, как sleep – slept", "img": "img/keep.jpg", "audio": "audio/keep.mp3", "ex": "I kept my old toys in a box.", "exru": "Я хранил свои старые игрушки в коробке.", "exaudio": "audio/keep-x.mp3"}, {"word": "leave", "answer": "leave – left – left", "ru": "уходить, уезжать; оставлять · ea → e + ft", "img": "img/leave.jpg", "audio": "audio/leave.mp3", "ex": "We left home at eight and went to school.", "exru": "Мы вышли из дома в восемь и пошли в школу.", "exaudio": "audio/leave-x.mp3"}, {"word": "lose", "answer": "lose – lost – lost", "ru": "терять; проигрывать · o + st", "img": "img/lose.jpg", "audio": "audio/lose.mp3", "ex": "I lost my keys, and then I found them in my bag.", "exru": "Я потерял ключи, а потом нашёл их в сумке.", "exaudio": "audio/lose-x.mp3"}, {"word": "pay", "answer": "pay – paid – paid", "ru": "платить · y → id (не payed)", "img": "img/pay.jpg", "audio": "audio/pay.mp3", "ex": "Dad paid for the pizza.", "exru": "Папа заплатил за пиццу.", "exaudio": "audio/pay-x.mp3"}, {"word": "put", "answer": "put – put – put", "ru": "класть, ставить · все три одинаковые", "img": "img/put.jpg", "audio": "audio/put.mp3", "ex": "I put my phone on the table.", "exru": "Я положил телефон на стол.", "exaudio": "audio/put-x.mp3"}, {"word": "sell", "answer": "sell – sold – sold", "ru": "продавать · e → o + ld, как tell – told", "img": "img/sell.jpg", "audio": "audio/sell.mp3", "ex": "Our neighbour sold his old car last week.", "exru": "Наш сосед продал свою старую машину на прошлой неделе.", "exaudio": "audio/sell-x.mp3"}, {"word": "sit", "answer": "sit – sat – sat", "ru": "сидеть · i → a, как swim – swam", "img": "img/sit.jpg", "audio": "audio/sit.mp3", "ex": "We sat at the back of the bus.", "exru": "Мы сидели в конце автобуса.", "exaudio": "audio/sit-x.mp3"}, {"word": "stand", "answer": "stand – stood – stood", "ru": "стоять · a → oo, как understand – understood", "img": "img/stand.jpg", "audio": "audio/stand.mp3", "ex": "We stood in the rain and waited for the bus.", "exru": "Мы стояли под дождём и ждали автобус.", "exaudio": "audio/stand-x.mp3"}, {"word": "teach", "answer": "teach – taught – taught", "ru": "учить, преподавать · -aught, как catch – caught", "img": "img/teach.jpg", "audio": "audio/teach.mp3", "ex": "My grandma taught me to swim.", "exru": "Бабушка научила меня плавать.", "exaudio": "audio/teach-x.mp3"}, {"word": "win", "answer": "win – won – won", "ru": "побеждать, выигрывать · won звучит как one /wʌn/", "img": "img/win.jpg", "audio": "audio/win.mp3", "ex": "Our team won the football match.", "exru": "Наша команда выиграла футбольный матч.", "exaudio": "audio/win-x.mp3"}];let i=0;const el=id=>document.getElementById(id),A=new Audio();
const mark=s=>s.replace(/\b(taught|stood|sold|paid|lost|left|kept|put|won|sat)\b/,'<b>$1</b>');
function render(){const c=CARDS[i];el('pic').src=c.img;el('pic').alt=c.ru;el('word').textContent=c.word;el('forms').textContent=c.answer;el('ru').textContent=c.ru;el('ex').innerHTML=mark(c.ex);el('exru').textContent=c.exru;
el('answer').hidden=true;el('show').hidden=false;el('count').textContent=(i+1)+' / '+CARDS.length;el('prev').disabled=i===0;el('next').disabled=i===CARDS.length-1;A.pause()}
const play=s=>{A.src=s;A.currentTime=0;A.play().catch(()=>{})};
function reveal(){el('answer').hidden=false;el('show').hidden=true;play(CARDS[i].audio)}
el('show').onclick=reveal;el('say').onclick=()=>play(CARDS[i].audio);el('sayx').onclick=()=>play(CARDS[i].exaudio);document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>play(b.dataset.a));
el('next').onclick=()=>{i=Math.min(CARDS.length-1,i+1);render()};el('prev').onclick=()=>{i=Math.max(0,i-1);render()};
document.onkeydown=e=>{if(e.target.closest('button,audio'))return;if(e.key===' '){e.preventDefault();reveal()}if(e.key==='ArrowRight')el('next').click();if(e.key==='ArrowLeft')el('prev').click()};render();</script></html>
